services:
  qdrant:
    image: qdrant/qdrant:latest
    ports:
      - "6333:6333"
    volumes:
      - qdrant_data:/qdrant/storage
    restart: unless-stopped
    mem_limit: 1g
    cpus: 1.0

  ollama:
    image: ollama/ollama:latest
    ports:
      - "11434:11434"
    volumes:
      - ollama_data:/root/.ollama
    restart: unless-stopped
    mem_limit: 6g
    cpus: 3.0
    # Radeon iGPU is not usable for acceleration on Windows -- runs CPU-only.
    #   docker compose exec ollama ollama pull qwen2.5:3b-instruct

  retrieval:
    build: ./retrieval
    ports:
      - "8001:8000"
    environment:
      USE_REAL_EMBEDDER: "${USE_REAL_EMBEDDER:-0}"
      USE_REAL_STORE: "${USE_REAL_STORE:-0}"
      USE_RERANKER: "{USE_RERANKER:-0}"
      RERANK_THRESHOLD: "{RERANK_THRESHOLD:-0.3}"
      QDRANT_URL: "http://qdrant:6333"
    depends_on:
      - qdrant
    restart: unless-stopped
    mem_limit: 3g
    cpus: 1.5

  generation:
    build: ./generation
    ports:
      - "8002:8000"
    environment:
      USE_REAL_LLM: "${USE_REAL_LLM:-0}"
    depends_on:
      - ollama
    restart: unless-stopped
    mem_limit: 512m
    cpus: 0.5

  gateway:
    build: ./gateway
    ports:
      - "8000:8000"
    environment:
      RETRIEVAL_URL: "http://retrieval:8000"
      GENERATION_URL: "http://generation:8000"
    depends_on:
      - retrieval
      - generation
    restart: unless-stopped
    mem_limit: 256m
    cpus: 0.5

  frontend:
    build: ./frontend
    ports:
      - "8501:8501"
    environment:
      GATEWAY_URL: "http://gateway:8000"
    depends_on:
      - gateway
    restart: unless-stopped
    mem_limit: 256m
    cpus: 0.5

volumes:
  qdrant_data:
  ollama_data: