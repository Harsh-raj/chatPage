services:
  qdrant:
    image: qdrant/qdrant:latest
    # No host port mapping -- nothing outside the docker-compose network
    # needs to reach Qdrant directly, only retrieval does, and that happens
    # over the internal network without any ports: entry at all.
    volumes:
      - qdrant_data:/qdrant/storage
    restart: unless-stopped
    mem_limit: 1g
    cpus: 1.0

  ollama:
    image: ollama/ollama:latest
    # No host port mapping, same reasoning as qdrant above -- only
    # generation needs to reach it, over the internal network.
    volumes:
      - ollama_data:/root/.ollama
    restart: unless-stopped
    mem_limit: 6g
    cpus: 3.0
    # Radeon iGPU is not usable for acceleration on Windows -- runs CPU-only.
    #   docker compose exec ollama ollama pull qwen2.5:3b-instruct

  retrieval:
    build: ./retrieval
    ports:
      - "8001:8000"
    environment:
      USE_REAL_EMBEDDER: "${USE_REAL_EMBEDDER:-0}"
      USE_REAL_STORE: "${USE_REAL_STORE:-0}"
      USE_RERANKER: "${USE_RERANKER:-0}"
      RERANK_THRESHOLD: "${RERANK_THRESHOLD:-0.3}"
      QDRANT_URL: "http://qdrant:6333"
      API_KEY: "${API_KEY:-}"
      LANGFUSE_PUBLIC_KEY: "${LANGFUSE_PUBLIC_KEY:-}"
      LANGFUSE_SECRET_KEY: "${LANGFUSE_SECRET_KEY:-}"
      LANGFUSE_HOST: "${LANGFUSE_HOST:-https://cloud.langfuse.com}"
    depends_on:
      - qdrant
    restart: unless-stopped
    mem_limit: 3g
    cpus: 1.5

  generation:
    build: ./generation
    ports:
      - "8002:8000"
    environment:
      USE_REAL_LLM: "${USE_REAL_LLM:-0}"
      API_KEY: "${API_KEY:-}"
      LANGFUSE_PUBLIC_KEY: "${LANGFUSE_PUBLIC_KEY:-}"
      LANGFUSE_SECRET_KEY: "${LANGFUSE_SECRET_KEY:-}"
      LANGFUSE_HOST: "${LANGFUSE_HOST:-https://cloud.langfuse.com}"
    depends_on:
      - ollama
    restart: unless-stopped
    mem_limit: 512m
    cpus: 0.5

  ingestion:
    # Build context is ./scripts -- this started as a CLI-only ingestion
    # script (see scripts/app/ingest_pdf.py) and kept that directory name;
    # it's now also served as an HTTP API (scripts/app/main.py) so the
    # frontend can upload PDFs instead of only invoking the CLI.
    build: ./scripts
    ports:
      - "8003:8000"
    environment:
      RETRIEVAL_URL: "http://retrieval:8000"
      GENERATION_URL: "http://generation:8000"
      API_KEY: "${API_KEY:-}"
      LANGFUSE_PUBLIC_KEY: "${LANGFUSE_PUBLIC_KEY:-}"
      LANGFUSE_SECRET_KEY: "${LANGFUSE_SECRET_KEY:-}"
      LANGFUSE_HOST: "${LANGFUSE_HOST:-https://cloud.langfuse.com}"
    depends_on:
      - retrieval
      - generation
    restart: unless-stopped
    # PyMuPDF + Tesseract OCR on multi-page scanned PDFs is the heaviest
    # single operation in this stack -- more headroom than the other
    # small/medium services, but well under retrieval's embedder+reranker load.
    mem_limit: 2g
    cpus: 1.0

  gateway:
    build: ./gateway
    ports:
      - "8000:8000"
    environment:
      RETRIEVAL_URL: "http://retrieval:8000"
      GENERATION_URL: "http://generation:8000"
      API_KEY: "${API_KEY:-}"
      LANGFUSE_PUBLIC_KEY: "${LANGFUSE_PUBLIC_KEY:-}"
      LANGFUSE_SECRET_KEY: "${LANGFUSE_SECRET_KEY:-}"
      LANGFUSE_HOST: "${LANGFUSE_HOST:-https://cloud.langfuse.com}"
    depends_on:
      - retrieval
      - generation
    restart: unless-stopped
    mem_limit: 256m
    cpus: 0.5

  frontend:
    build: ./frontend
    ports:
      - "8501:8501"
    environment:
      GATEWAY_URL: "http://gateway:8000"
      INGESTION_URL: "http://ingestion:8000"
      API_KEY: "${API_KEY:-}"
    depends_on:
      - gateway
      - ingestion
    restart: unless-stopped
    mem_limit: 256m
    cpus: 0.5

volumes:
  qdrant_data:
  ollama_data: