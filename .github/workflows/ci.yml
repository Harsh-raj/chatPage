name: CI

"on":
  pull_request:
    branches: [dev, main]
  push:
    branches: [dev, main]

jobs:
  unit-tests:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        component: [gateway, retrieval, generation, scripts]
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: "pip"

      - name: Install dependencies
        working-directory: ${{ matrix.component }}
        run: pip install -r requirements.txt pytest httpx

      - name: Run unit tests
        working-directory: ${{ matrix.component }}
        run: pytest tests/ -v

  integration-test:
    needs: unit-tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Build and start all services (stub mode, no real models, keeps CI fast)
        run: docker compose up --build -d

      - name: Wait for services to be healthy
        run: |
          for i in {1..30}; do
            if curl -sf http://localhost:8000/health && \
               curl -sf http://localhost:8001/health && \
               curl -sf http://localhost:8002/health; then
              echo "All services healthy"
              exit 0
            fi
            echo "Waiting for services..."
            sleep 2
          done
          echo "Services did not become healthy in time"
          docker compose logs
          exit 1

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install test dependencies
        run: pip install pytest httpx

      - name: Run integration tests against live containers
        run: pytest tests/integration/ -v

      - name: Dump logs on failure
        if: failure()
        run: docker compose logs

      - name: Tear down
        if: always()
        run: docker compose down -v

  build-and-push:
    needs: integration-test
    # Only build/push images when something is actually promoted to main like milestone, not every push to dev.
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    strategy:
      matrix:
        component: [gateway, retrieval, generation, frontend]
    steps:
      - uses: actions/checkout@v4

      - uses: docker/setup-buildx-action@v3

      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - uses: docker/build-push-action@v6
        with:
          context: ./${{ matrix.component }}
          push: true
          tags: ghcr.io/${{ github.repository }}/${{ matrix.component }}:${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
