# save at root and run: pip install pre-commit && pre-commit install
repos:
  - repo: http://github.com/astral-sh/ruff-pre-commit
    rev: v0.9.4
    hooks:
      - id: ruff
        args: [--fix]
      - id: ruff-format
  - repo: https://github.com/pre-commit/mirrors-mypy
    rev: v1.13.0
    hooks:
      - id: mypy
        name: mypy (gateway)
        files: ^gateway/app/
        args: [--ignore-missing-imports]
      - id: mypy
        name: mypy (retrieval)
        files: ^retrieval/app/
        args: [--ignore-missing-imports]
      - id: mypy
        name: mypy (generation)
        files: ^generation/app/
        args: [--ignore-missing-imports]
      - id: mypy
        name: mypy (frontend)
        files: ^frontend/app/
        args: [--ignore-missing-imports]
        addition_dependencies: [types-requests]
      - id: mypy
        name: mypy (scripts)
        files: ^scripts/app/
        args: [--ignore-missing-imports]
        addition_dependencies: [types-requests]
  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v5.0.0
    hooks:
      - id: trailing-whitespace
      - id: end-of-file-fixer
      - id: check-yaml
      - id: check-added-large-files
